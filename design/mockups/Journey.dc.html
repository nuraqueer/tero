<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey planner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F0EEE6}
a{color:#B4532F}a:hover{color:#8F3F22}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:0.5px solid rgba(31,30,29,0.15);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 8px 24px rgba(20,20,19,0.08)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF9F5; color: #141413; font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif">
<div style="padding: 58px 16px 0">
<a href="Suits.dc.html" class="glass" aria-label="Back to Suits" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #141413">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
</div>
<div style="padding: 14px 22px 0">
<div style="font-size: 12px; font-weight: 600; color: #B4532F; letter-spacing: 0.06em">WANDS · YOUR JOURNEY</div>
<h1 style="margin: 4px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 400">Top surgery</h1>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: #3D3D3A">
<span>Nairobi</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4532F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<span>Bangkok</span>
<span style="color: #9C9A92">·</span><span style="color: #5E5D59">private to you</span>
</div>
</div>

<div style="padding: 22px 22px 0; position: relative">
<div style="position: absolute; left: 33px; top: 32px; bottom: 30px; width: 1px; background: rgba(31,30,29,0.2)"></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.pick}}" style="position: relative; display: flex; gap: 16px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 0; cursor: pointer; font-family: inherit; color: #141413">
<div style="{{s.dot}}">{{s.mark}}</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{s.title}}</div>
<div style="font-size: 13px; color: #5E5D59; margin-top: 2px">{{s.sub}}</div>
<sc-if value="{{s.open}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 10px; background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.15); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #3D3D3A">{{s.detail}}</div>
</sc-if>
</div>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 10px">
<a href="Messages.dc.html" style="flex: 1; min-height: 48px; border-radius: 24px; background: #141413; color: #FAF9F5; text-decoration: none; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Talk to a verified coordinator</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 1 };
  }
  renderVals() {
    const raw = [
      { title: 'Research', sub: 'Guides read, three surgeons saved', state: 'done', detail: 'Your saved surgeons and guides are kept offline on this phone.' },
      { title: 'Consultation', sub: 'Video call with the surgeon’s team', state: 'now', detail: 'Estimate for surgery, stay and aftercare: [USD range], from member reports. Ask the coordinator to confirm.' },
      { title: 'Travel plan', sub: 'Visa, flights, where to stay', state: 'next', detail: 'Members who travelled this route can share what helped. Travel warnings for both countries appear here.' },
      { title: 'Surgery', sub: 'Date to be confirmed', state: 'next', detail: 'A trusted member nearby can be your check-in contact while you’re away.' },
      { title: 'Recovery', sub: 'Aftercare and follow-ups', state: 'next', detail: 'Recovery guide, follow-up reminders and a Circle for people recovering now.' }
    ];
    const steps = raw.map((s, i) => {
      const base = 'position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ';
      const dot = s.state === 'done' ? base + 'background: #141413; color: #FAF9F5'
        : s.state === 'now' ? base + 'background: #D97757; color: #FFFFFF; box-shadow: 0 0 0 4px rgba(217,119,87,0.2)'
        : base + 'background: #FAF9F5; color: #5E5D59; border: 1px solid rgba(31,30,29,0.3); box-sizing: border-box';
      return { ...s, dot, mark: s.state === 'done' ? '✓' : String(i + 1), open: this.state.open === i, pick: () => this.setState({ open: this.state.open === i ? -1 : i }) };
    });
    return { steps };
  }
}
</script>
</body>
</html>
