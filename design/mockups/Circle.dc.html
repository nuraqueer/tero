<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circle conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F0EEE6}
a{color:#B4532F}a:hover{color:#8F3F22}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:0.5px solid rgba(31,30,29,0.15);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 8px 24px rgba(20,20,19,0.08)}
.pill{border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;min-height:36px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF9F5; color: #141413; font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif">
<div style="padding: 58px 16px 0; display: flex; align-items: center; gap: 12px">
<a href="Gathering.dc.html" class="glass" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #141413; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; text-align: center">
<div style="font-size: 17px; font-weight: 600">Night Library</div>
<div style="font-size: 12px; color: #5E5D59">Circle · Wands</div>
</div>
<button type="button" class="glass" aria-label="Members and pinned" style="width: 44px; height: 44px; border-radius: 22px; color: #141413; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c1.8.9 3 2.9 3 5.5"></path></svg>
</button>
</div>
<div style="display: flex; gap: 8px; padding: 16px 16px 0; overflow: hidden">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
<button type="button" class="pill" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button>
</sc-for>
</div>
<a href="Space.dc.html" class="glass" style="margin: 14px 16px 0; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #141413; border-color: rgba(217,119,87,0.5)">
<div style="width: 10px; height: 10px; border-radius: 5px; background: #D97757; flex-shrink: 0"></div>
<div style="flex: 1; font-size: 15px; font-weight: 600">Live: Learning Swahili basics</div>
<div style="font-size: 14px; font-weight: 600; color: #B4532F">Join</div>
</a>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 22px 16px 0">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
<div style="{{m.rowStyle}}">
<sc-if value="{{m.showName}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; color: #5E5D59; margin: 0 0 4px 12px">{{m.name}}</div>
</sc-if>
<div style="{{m.bubbleStyle}}">{{m.text}}</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; align-items: center; gap: 8px">
<button type="button" class="glass" aria-label="Add" style="width: 44px; height: 44px; border-radius: 22px; color: #141413; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<div class="glass" style="flex: 1; min-width: 0; height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 5px 0 16px; box-sizing: border-box">
<label for="circle-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="circle-msg" type="text" placeholder="Message Night Library" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #141413; font-size: 16px; font-family: inherit">
<button type="button" aria-label="Voice message" style="width: 34px; height: 34px; border-radius: 17px; border: 0; background: transparent; color: #5E5D59; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { topic: 'All' };
  }
  renderVals() {
    const names = ['All', 'Books', 'Courses', 'Meetups', 'Help'];
    const topics = names.map((n) => {
      const on = this.state.topic === n;
      return {
        name: n,
        pick: () => this.setState({ topic: n }),
        style: on
          ? 'background: #141413; color: #FAF9F5; border: 1px solid #141413'
          : 'background: rgba(31,30,29,0.07); color: #141413; border: 1px solid rgba(31,30,29,0.12)'
      };
    });
    const mine = 'align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end';
    const theirs = 'align-self: flex-start; max-width: 78%; display: flex; flex-direction: column';
    const bMine = 'background: #E3DACC; color: #141413; padding: 10px 14px; border-radius: 20px 20px 6px 20px; font-size: 16px; line-height: 1.35';
    const bTheirs = 'background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.15); color: #141413; padding: 10px 14px; border-radius: 20px 20px 20px 6px; font-size: 16px; line-height: 1.35';
    const raw = [
      { me: false, name: 'Quill', text: 'Bookbinding notes are pinned. Week two starts Saturday.' },
      { me: false, name: 'Wren', text: 'Can someone recommend a beginner course in French?' },
      { me: true, name: 'You', text: 'There is one in Suits under Wands. I am taking it too.' },
      { me: false, name: 'Wren', text: 'Thank you! Joining now.' },
      { me: false, name: 'Ember', text: 'The Swahili Space is live if anyone wants to practise.' }
    ];
    const msgs = raw.map((m) => ({
      text: m.text,
      name: m.name,
      showName: !m.me,
      rowStyle: m.me ? mine : theirs,
      bubbleStyle: m.me ? bMine : bTheirs
    }));
    return { topics, msgs };
  }
}
</script>
</body>
</html>
