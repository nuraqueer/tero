<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tero wordmark options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Cinzel:wght@500&amp;family=Marcellus&amp;family=Gloock&amp;family=Syne:wght@700&amp;family=Italiana&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF9F5}
.tile{border:0.5px solid rgba(31,30,29,0.15);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.light{height:170px;background:#FAF9F5;display:flex;align-items:center;justify-content:center;color:#141413}
.dark{height:84px;background:#141413;display:flex;align-items:center;justify-content:center;color:#FAF9F5}
.cap{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;color:#5E5D59;background:#FFFFFF;border-top:0.5px solid rgba(31,30,29,0.12)}
.cap b{color:#141413;font-weight:600}
</style>
</helmet>
<div style="width: 1200px; height: 900px; box-sizing: border-box; padding: 48px; background: #FAF9F5; font-family: 'Instrument Sans', system-ui, sans-serif; color: #141413">
<div style="font-size: 13px; font-weight: 600; color: #B4532F; letter-spacing: 0.06em">PICK ONE</div>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; margin-top: 4px">Wordmark options for Tero</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 28px">
<div class="tile">
<div class="light" style="font-family: 'Instrument Serif', Georgia, serif; font-size: 96px">Tero</div>
<div class="dark" style="font-family: 'Instrument Serif', Georgia, serif; font-size: 48px; font-style: italic">Tero</div>
<div class="cap"><b>A</b><span>Instrument Serif · editorial, calm</span></div>
</div>
<div class="tile">
<div class="light" style="font-family: 'Cinzel', Georgia, serif; font-size: 64px; font-weight: 500; letter-spacing: 0.16em; padding-left: 0.16em">TERO</div>
<div class="dark" style="font-family: 'Cinzel', Georgia, serif; font-size: 32px; font-weight: 500; letter-spacing: 0.16em; padding-left: 0.16em">TERO</div>
<div class="cap"><b>B</b><span>Cinzel · engraved, like a tarot card</span></div>
</div>
<div class="tile">
<div class="light" style="font-family: 'Marcellus', Georgia, serif; font-size: 70px; letter-spacing: 0.1em; padding-left: 0.1em">TERO</div>
<div class="dark" style="font-family: 'Marcellus', Georgia, serif; font-size: 34px; letter-spacing: 0.1em; padding-left: 0.1em">TERO</div>
<div class="cap"><b>C</b><span>Marcellus · classical, soft</span></div>
</div>
<div class="tile">
<div class="light" style="font-family: 'Gloock', Georgia, serif; font-size: 90px">Tero</div>
<div class="dark" style="font-family: 'Gloock', Georgia, serif; font-size: 44px">Tero</div>
<div class="cap"><b>D</b><span>Gloock · bold, high contrast</span></div>
</div>
<div class="tile">
<div class="light" style="font-family: 'Syne', system-ui, sans-serif; font-size: 84px; font-weight: 700; letter-spacing: -0.03em">tero</div>
<div class="dark" style="font-family: 'Syne', system-ui, sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -0.03em">tero</div>
<div class="cap"><b>E</b><span>Syne · modern, artistic</span></div>
</div>
<div class="tile">
<div class="light" style="font-family: 'Italiana', Georgia, serif; font-size: 80px; letter-spacing: 0.12em; padding-left: 0.12em">TERO</div>
<div class="dark" style="font-family: 'Italiana', Georgia, serif; font-size: 40px; letter-spacing: 0.12em; padding-left: 0.12em">TERO</div>
<div class="cap"><b>F</b><span>Italiana · thin, elegant</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
