<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Private chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F0EEE6}
a{color:#B4532F}a:hover{color:#8F3F22}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:0.5px solid rgba(31,30,29,0.15);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 8px 24px rgba(20,20,19,0.08)}
.round{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#141413;cursor:pointer;flex-shrink:0}
.mine{align-self:flex-end;max-width:76%;background:#E3DACC;color:#141413;padding:10px 14px;border-radius:20px 20px 6px 20px;font-size:16px;line-height:1.35}
.theirs{align-self:flex-start;max-width:76%;background:#FFFFFF;border:0.5px solid rgba(31,30,29,0.15);padding:10px 14px;border-radius:20px 20px 20px 6px;font-size:16px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;background:transparent;font-family:inherit;font-size:16px;color:#141413;text-align:left;cursor:pointer;border-radius:12px;width:100%}
.opt:hover{background:rgba(115,114,108,0.1)}
.opt svg{color:#B4532F;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF9F5; color: #141413; font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif">
<div style="padding: 58px 16px 0; display: flex; align-items: center; gap: 12px">
<a href="Gathering.dc.html" class="glass round" aria-label="Back">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="width: 44px; height: 44px; border-radius: 22px; background: #EDE8DF; font-family: 'Newsreader', Georgia, serif; display: flex; align-items: center; justify-content: center; font-size: 20px">Q</div>
<div style="font-size: 14px; font-weight: 600">Quill</div>
</div>
<button type="button" class="glass round" aria-label="Voice call">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"></path></svg>
</button>
</div>
<div style="display: flex; justify-content: center; margin-top: 14px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5E5D59; background: rgba(31,30,29,0.06); border-radius: 14px; padding: 6px 12px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M10 2h4"></path></svg>
<span>{{timerLabel}}</span>
</div>
</div>
<sc-if value="{{askKeep}}" hint-placeholder-val="{{ true }}">
<div style="margin: 14px 16px 0; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.15)">
<div style="font-size: 15px; line-height: 1.35">Quill wants to keep this chat. It stays only if you both agree.</div>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{keep}}" style="flex: 1; min-height: 44px; border-radius: 22px; border: 0; background: #141413; color: #FAF9F5; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit">Keep chat</button>
<button type="button" onClick="{{decline}}" style="flex: 1; min-height: 44px; border-radius: 22px; border: 0.5px solid rgba(31,30,29,0.3); background: transparent; color: #141413; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit">Let it clear</button>
</div>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 16px 0">
<div class="theirs">Did the course link work for you?</div>
<div class="mine">Yes, I started this morning.</div>
<div class="mine">Want to practise together in the next Space?</div>
<div class="theirs">Yes! Saturday works.</div>
<div style="align-self: center; font-size: 12px; color: #5E5D59; margin: 4px 0">Quill took a screenshot</div>
<sc-for list="{{sent}}" as="m" hint-placeholder-count="0">
<div class="mine">{{m.text}}</div>
</sc-for>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="glass" style="position: absolute; left: 12px; bottom: 84px; width: 236px; border-radius: 22px; padding: 6px; display: flex; flex-direction: column">
<button type="button" class="opt" onClick="{{closeMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>Photo <span style="margin-left: auto; font-size: 12px; color: #5E5D59">sent blurred</span></button>
<button type="button" class="opt" onClick="{{closeMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Camera</button>
<button type="button" class="opt" onClick="{{closeMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>City <span style="margin-left: auto; font-size: 12px; color: #5E5D59">never exact</span></button>
<button type="button" class="opt" onClick="{{closeMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M12 8.5l1.1 2.3 2.5.3-1.8 1.7.4 2.5-2.2-1.2-2.2 1.2.4-2.5-1.8-1.7 2.5-.3z"></path></svg>Tero card</button>
<button type="button" class="opt" onClick="{{closeMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9.5c-.5-1-1.4-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"></path></svg>Send support</button>
</div>
</sc-if>

<div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; align-items: center; gap: 8px">
<button type="button" class="glass round" aria-label="Add" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="{{plusStyle}}"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<div class="glass" style="flex: 1; min-width: 0; height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 5px 0 16px; box-sizing: border-box">
<label for="dm-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="dm-msg" type="text" placeholder="Message" value="{{draft}}" onChange="{{onDraft}}" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #141413; font-size: 16px; font-family: inherit">
<sc-if value="{{hasText}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Send" onClick="{{send}}" style="width: 34px; height: 34px; border-radius: 17px; border: 0; background: #D97757; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</button>
</sc-if>
<sc-if value="{{noText}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Voice message" style="width: 34px; height: 34px; border-radius: 17px; border: 0; background: transparent; color: #5E5D59; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { choice: 'ask', menu: false, draft: '', sent: [] };
  }
  renderVals() {
    const st = this.state;
    const has = st.draft.trim().length > 0;
    return {
      askKeep: st.choice === 'ask',
      keep: () => this.setState({ choice: 'kept' }),
      decline: () => this.setState({ choice: 'clear' }),
      timerLabel: st.choice === 'kept' ? 'Kept · you both agreed' : 'Clears 24 hours after reading',
      menuOpen: st.menu,
      toggleMenu: () => this.setState({ menu: !st.menu }),
      closeMenu: () => this.setState({ menu: false }),
      plusStyle: 'transition: transform 0.25s; transform: rotate(' + (st.menu ? '45deg' : '0deg') + ')',
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      hasText: has,
      noText: !has,
      sent: st.sent,
      send: () => { if (has) this.setState({ draft: '', sent: st.sent.concat([{ text: st.draft.trim() }]) }); }
    };
  }
}
</script>
</body>
</html>
