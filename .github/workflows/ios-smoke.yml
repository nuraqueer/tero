name: iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-smoke.yml'
      - 'apps/tero/**'
      - 'packages/sefirah-*/**'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-ios
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Initialize the iOS project
        working-directory: apps/tero
        run: bunx tauri ios init --ci
      - name: Build unsigned iOS simulator app
        working-directory: apps/tero
        run: bunx tauri ios build --debug --target x86_64 --no-sign --ci
