name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Initialize the Android project
        working-directory: apps/tero
        run: bunx tauri android init --ci
      - name: Build test APK for ARM64
        working-directory: apps/tero
        run: bunx tauri android build --apk --target aarch64 --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tero-android-debug-arm64
          path: apps/tero/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3
