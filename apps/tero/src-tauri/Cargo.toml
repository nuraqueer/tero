[package]
name = "tero"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "tero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
