[package]
name = "tero"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "tero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sefirah-mls = { path = "../../../packages/sefirah-mls" }
sefirah-tor = { path = "../../../packages/sefirah-tor" }
sefirah-routing = { path = "../../../packages/sefirah-routing" }
sefirah-identity = { path = "../../../packages/sefirah-identity" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
