[package]
name = "sefirah-mls"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "sefirah-mls-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
ed25519-dalek = "2"
bs58 = "0.5"
thiserror = "2"
uniffi = { version = "=0.32.2", default-features = false }
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
