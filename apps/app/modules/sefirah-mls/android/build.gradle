apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'org.pherus.sefirah.mls'
version = '0.1.0'
def mlsEnabled = System.getenv('SEFIRAH_NATIVE_BUILD') == '1'

android {
  namespace 'org.pherus.sefirah.mls'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
    if (mlsEnabled) { ndk { abiFilters 'arm64-v8a' } }
  }
  sourceSets.main {
    java.srcDirs = mlsEnabled ? ['src/enabled/java', '../bindings/kotlin'] : ['src/disabled/java']
    jniLibs.srcDirs = mlsEnabled ? ['src/main/jniLibs'] : []
  }
}

if (mlsEnabled) {
  dependencies { implementation 'net.java.dev.jna:jna:5.18.1@aar' }
  def buildMls = tasks.register('buildSefirahMls', Exec) {
    workingDir projectDir.parentFile
    commandLine 'bash', 'build-bindings-android.sh'
    inputs.dir '../native/src'
    inputs.file '../native/Cargo.toml'
    inputs.file '../native/Cargo.lock'
    inputs.file '../native/uniffi.toml'
    inputs.file '../build-android.sh'
    inputs.file '../build-bindings-android.sh'
    outputs.dir '../bindings/kotlin'
    outputs.file 'src/main/jniLibs/arm64-v8a/libsefirah_mls.so'
  }
  tasks.named('preBuild').configure { dependsOn buildMls }
}
