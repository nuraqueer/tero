apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'org.pherus.sefirah'
version = '0.1.0'
def torEnabled = System.getenv('SEFIRAH_NATIVE_BUILD') == '1'

android {
  namespace 'org.pherus.sefirah'
  buildFeatures { buildConfig true }
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
    buildConfigField 'boolean', 'SEFIRAH_TOR_ENABLED', torEnabled.toString()
    if (torEnabled) { ndk { abiFilters 'arm64-v8a' } }
  }
  sourceSets.main.jniLibs.srcDirs = torEnabled ? ['src/main/jniLibs'] : []
}

def buildTor = tasks.register('buildSefirahTor', Exec) {
  workingDir projectDir.parentFile
  commandLine 'bash', 'build-android.sh'
  inputs.dir '../native/src'
  inputs.file '../native/Cargo.toml'
  inputs.file '../native/Cargo.lock'
  inputs.file '../build-android.sh'
  outputs.file 'src/main/jniLibs/arm64-v8a/libsefirah_tor.so'
}
if (torEnabled) {
  tasks.named('preBuild').configure { dependsOn buildTor }
}
