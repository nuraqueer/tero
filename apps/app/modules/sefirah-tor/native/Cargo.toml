[package]
name = "sefirah-tor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "sefirah_tor"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "sefirah-tor-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "static-sqlite", "onion-service-client", "onion-service-service"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tor-hsservice = "=0.47.0"
tor-cell = "=0.47.0"
tor-proto = "=0.47.0"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
anyhow = "1"
safelog = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# libc 0.2.190 removes Apple declarations still used by Arti's sysinfo dependency.
# Keep the upstream RNG intact until those dependencies support the new bindings.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
sysinfo = { version = "=0.38.4", default-features = false, features = ["apple-app-store"] }

[profile.release]
strip = true
lto = "thin"
